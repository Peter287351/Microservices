# ===================================================================
# user-service 配置文件（模块 00：纯单体版，还没有任何 Spring Cloud 组件）
# 模块 01（Nacos 注册）和模块 02（Nacos Config）会逐步改造这个文件
# ===================================================================

server:
  port: 8081                # 服务监听端口

spring:
  application:
    name: user-service      # 服务名：模块 01 注册到 Nacos 时的"身份证"，必须全局唯一
  # ── 模块 02 新增：从 Nacos 拉取配置 ────────────────────────
  config:
    import:
      - optional:nacos:user-service.yml
      # Data ID 与服务同名是约定俗成；optional: 前缀 = 远端还没有这份配置时也能正常启动
  # ── 模块 01/02：Nacos 地址（简写，注册中心+配置中心共用）────
  cloud:
    nacos:
      server-addr: localhost:8848   # 容器映射到宿主机 8848
    # ── 模块 06 新增：Sentinel 控制台 ─────────────────────────
    sentinel:
      transport:
        dashboard: localhost:8858
    # ── 模块 08 新增：Stream + RocketMQ（事件消费方）──────────
    function:
      definition: orderCreated        # 声明函数式消费者（Bean 的名字）
    stream:
      rocketmq:
        binder:
          name-server: localhost:9876
      bindings:
        orderCreated-in-0:            # 入站通道：函数名 + "-in-0"
          destination: order-created-topic   # 订阅的 Topic，与生产方一致
          group: user-service-group    # 消费者组：同组内负载均衡，不同组各自收一份
      # 服务启动后把 "user-service + IP:8081" 注册上去，并每 5 秒心跳证明自己活着
  datasource:
    url: jdbc:mysql://localhost:3307/micro?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    #            └─ 库地址(容器 MySQL 映射到宿主机 3307，避开本机已占用的 3306)  └─ 时区：防止时间差 8 小时
    username: root
    password: root123       # 与 docker-compose.yml 中 MYSQL_ROOT_PASSWORD 一致
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update      # 启动时按实体类自动建表/更新表结构（学习用，生产禁用）
    show-sql: true          # 控制台打印 SQL，便于学习观察
    open-in-view: false     # 关闭 OSIV，避免数据库连接被视图层长期占用

# ── 模块 07 新增：链路追踪 ─────────────────────────────────
management:
  tracing:
    sampling:
      probability: 1.0       # 采样率 1.0=全采（学习环境）；生产一般 0.1
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
