# ===================================================================
# gateway-service 配置（模块 05）：全系统唯一入口
# 之后浏览器/Apifox 一律访问 http://localhost:8080，不再直连 8081/8082
# ===================================================================

server:
  port: 8080

# ── 模块 07 新增：链路追踪（trace 从大门就开始记录）─────────
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# ── 模块 10 新增：JWT 验签密钥（与 auth-service 一致，HS256 对称密钥）──
# ⚠️ 学习环境明文；生产放配置中心/密钥管理，且建议 RS256 公私钥分离
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: "micro-learning-secret-key-0123456789abcdef0123456789abcdef"

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      server-addr: localhost:8848        # 注册自己 + 发现下游服务
    gateway:
      routes:
        # 一条路由 = id（唯一名字）+ uri（去哪）+ predicates（什么请求算命中）+ filters（命中后做什么加工）
        - id: user-service-route
          uri: lb://user-service         # lb = LoadBalancer：从 Nacos 实例列表里负载均衡挑一个（模块04）
          predicates:
            - Path=/api/users/**         # 凡是 /api/users/ 开头的请求都归用户服务
          filters:
            - StripPrefix=1              # 转发前剥掉第 1 段路径：/api/users/1 → /users/1
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1              # /api/orders?userId=1 → /orders?userId=1
        - id: user-account-route
          uri: lb://user-service
          predicates:
            - Path=/api/accounts/**      # 模块09 补的路由：账户余额接口（此前 404 的原因）
          filters:
            - StripPrefix=1
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**          # 登录接口：网关唯一放行（无需令牌）的入口（模块10）
          filters:
            - StripPrefix=1              # /api/auth/login → /auth/login

# 对照记忆：
#   以前直连：http://localhost:8081/users/1
#   现在走网关：http://localhost:8080/api/users/1  （网关剥掉 /api 后转发）
