# ===================================================================
# gateway-service 配置（模块 05）：全系统唯一入口
# 之后浏览器/Apifox 一律访问 http://localhost:8080，不再直连 8081/8082
# ===================================================================

server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      server-addr: localhost:8848        # 注册自己 + 发现下游服务
    gateway:
      routes:
        # 一条路由 = id（唯一名字）+ uri（去哪）+ predicates（什么请求算命中）+ filters（命中后做什么加工）
        - id: user-service-route
          uri: lb://user-service         # lb = LoadBalancer：从 Nacos 实例列表里负载均衡挑一个（模块04）
          predicates:
            - Path=/api/users/**         # 凡是 /api/users/ 开头的请求都归用户服务
          filters:
            - StripPrefix=1              # 转发前剥掉第 1 段路径：/api/users/1 → /users/1
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1              # /api/orders?userId=1 → /orders?userId=1

# 对照记忆：
#   以前直连：http://localhost:8081/users/1
#   现在走网关：http://localhost:8080/api/users/1  （网关剥掉 /api 后转发）
