# docker-compose：本项目所有中间件的"一键启停"清单。
# 随学习模块推进会不断追加新服务（Nacos、Sentinel、Zipkin、RocketMQ、Seata…）。
# 当前（模块 00）：只有 MySQL。
#
# 常用命令（在仓库根目录执行）：
#   docker compose -f docker/docker-compose.yml up -d      # 后台启动
#   docker compose -f docker/docker-compose.yml ps         # 查看状态
#   docker compose -f docker/docker-compose.yml logs mysql # 看 MySQL 日志
#   docker compose -f docker/docker-compose.yml down       # 停止（数据保留在卷里）

services:
  # ── 模块 09 新增：Seata 事务协调器（TC）─────────────────────
  seata-server:
    image: seataio/seata-server:2.0.0
    container_name: micro-seata
    restart: unless-stopped
    ports:
      - "8091:8091"           # TC 服务端口：各服务的事务协调都连这里
      - "7091:7091"           # 控制台 UI：http://localhost:7091（seata/seata）

  # ── 模块 08 新增：RocketMQ（NameServer + Broker + 控制台）────
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.3
    container_name: micro-rocketmq-namesrv
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    command: sh mqnamesrv
    ports:
      - "9876:9876"           # NameServer：生产路由信息的"通讯录"

  rocketmq-broker:
    image: apache/rocketmq:5.1.3
    container_name: micro-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    ports:
      - "10909:10909"         # VIP 通道
      - "10911:10911"         # 主端口：收发消息
      - "10912:10912"         # HA 高可用端口

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: micro-rocketmq-dashboard
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    ports:
      - "8180:8080"           # 控制台：http://localhost:8180

  # ── 模块 07 新增：Zipkin 链路追踪 ────────────────────────────
  # UI：http://localhost:9411
  zipkin:
    image: openzipkin/zipkin:3
    container_name: micro-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"           # API + 查询 UI

  # ── 模块 06 新增：Sentinel 控制台 ────────────────────────────
  # 控制台：http://localhost:8858 （账号密码 sentinel/sentinel）
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.0
    container_name: micro-sentinel
    restart: unless-stopped
    ports:
      - "8858:8858"           # 控制台 Web
      # 服务与本控制台的通信端口 8719 用默认值，未与宿主机端口冲突可不映射

  # ── 模块 01 新增：Nacos 注册中心 ──────────────────────────────
  # 控制台：http://localhost:8848/nacos （账号密码 nacos/nacos）
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: micro-nacos
    restart: unless-stopped
    environment:
      MODE: standalone        # 单机模式（学习用；生产环境是 3 节点集群）
      TZ: Asia/Shanghai
      JVM_XMS: 256m           # 限制堆内存，学习环境不必占用太多资源
      JVM_XMX: 512m
    ports:
      - "8848:8848"           # HTTP API + 控制台
      - "9848:9848"           # gRPC 端口：客户端 2.x 注册/心跳全走它，规则=主端口+1000，少映射必报错

  mysql:
    image: mysql:8.0.36
    container_name: micro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123      # 学习环境用简单密码，生产环境绝不能这样
      MYSQL_DATABASE: micro             # 首次启动自动创建的业务数据库
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"                     # 宿主机 3307 → 容器 3306
      # 本机 3306 已被 Windows 自带的 MySQL 服务占用，故映射到 3307 避开冲突
    volumes:
      - mysql-data:/var/lib/mysql       # 数据持久化：容器删除数据也不丢
      - ./mysql/init:/docker-entrypoint-initdb.d:ro   # 首次启动自动执行的初始化 SQL
    command:
      - --character-set-server=utf8mb4  # 字符集：支持中文和 emoji
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
