# RocketMQ Broker 配置（挂载进容器使用）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# ⚠️ 本文件最关键的一行：
# Broker 向 NameServer 注册"客户端连我用的地址"。这个地址必须让【所有客户端】都能解析：
#   - 我们的 Java 服务跑在宿主机（IDEA）上 → 必须是宿主机可达的 IP
#   - host.docker.internal 只在容器内可解析，Windows 宿主机解析不了（E08-3 教训）
#   - 192.168.85.1 是本机虚拟网卡的 IP（各服务注册用的就是它，宿主机互通已验证）
#   ⚠️ 若换网络/换电脑导致该 IP 变化，这里要同步修改后重建 broker 容器
brokerIP1 = 192.168.85.1
namesrvAddr = rocketmq-namesrv:9876

deleteWhen = 04              # 凌晨 4 点清理过期消息
fileReservedTime = 48        # 消息保留 48 小时
flushDiskType = ASYNC_FLUSH  # 异步刷盘（学习环境够用；金融级用 SYNC_FLUSH）
autoCreateTopicEnable = true # 自动建 Topic（学习方便；生产关闭防手滑建错）
