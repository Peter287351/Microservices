# RocketMQ Broker 配置（挂载进容器使用）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# ⚠️ 本文件最关键的一行：
# Broker 向 NameServer 注册时要声明"宿主机可达"的地址。
# 我们的 Java 服务跑在宿主机（IDEA）上，若不设置，Broker 注册的是容器内网 IP，
# 宿主机上的客户端按那个 IP 连不上（消息发送超时）。host.docker.internal 在
# Docker Desktop（Win/Mac）里指向宿主机，配合 ports 端口映射即可互通。
brokerIP1 = host.docker.internal
namesrvAddr = rocketmq-namesrv:9876

deleteWhen = 04              # 凌晨 4 点清理过期消息
fileReservedTime = 48        # 消息保留 48 小时
flushDiskType = ASYNC_FLUSH  # 异步刷盘（学习环境够用；金融级用 SYNC_FLUSH）
autoCreateTopicEnable = true # 自动建 Topic（学习方便；生产关闭防手滑建错）
