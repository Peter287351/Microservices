# ── 模块 09 新增：Seata 分布式事务 ─────────────────────────
seata:
  tx-service-group: default_tx_group     # 事务组名（TM 用它找 TC）
  service:
    vgroup-mapping:
      default_tx_group: default          # 事务组 → 逻辑集群名
    grouplist:
      default: 127.0.0.1:8091            # TC（seata-server 容器）直连地址
  data-source-proxy-mode: AT             # AT 模式：自动代理数据源，写 undo_log 回滚镜像

spring:
  application:
    name: order-service     # 服务名：模块 01 注册到 Nacos 时用它
  # ── 模块 02 新增：从 Nacos 拉取配置 ────────────────────────
  config:
    import:
      - optional:nacos:order-service.yml
  # ── 模块 01/02：Nacos 地址（简写，注册中心+配置中心共用）────
  cloud:
    nacos:
      server-addr: localhost:8848   # 容器映射到宿主机 8848
    # ── 模块 06 新增：Sentinel 控制台 ─────────────────────────
    sentinel:
      transport:
        dashboard: localhost:8858   # 控制台地址（Docker 映射）
      # 注意：控制台是"懒加载"——服务要先被请求至少一次，控制台里才会出现它
    # ── 模块 08 新增：Stream + RocketMQ（事件生产方）──────────
    stream:
      rocketmq:
        binder:
          name-server: localhost:9876   # RocketMQ NameServer（Docker 映射）
      bindings:
        orderCreated-out-0:             # 出站通道：StreamBridge.send 用这个名字
          destination: order-created-topic   # 消息发往的 Topic（自动创建）
  datasource:
    # 学习阶段两个服务共用 micro 库（表不同：t_user / t_order）；
    # 真实微服务推荐"一服务一库"，模块 09 讨论
    url: jdbc:mysql://localhost:3307/micro?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 容器 MySQL 映射到宿主机 3307（本机 3306 已被 Windows 自带 MySQL 占用）
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

# ── 模块 07 新增：链路追踪 ─────────────────────────────────
management:
  tracing:
    sampling:
      probability: 1.0       # 采样率 1.0=全采（学习环境）；生产一般 0.1（10%），省存储
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans   # 追踪数据上报地址（Docker Zipkin）
